[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinelai"
version = "1.0.0"
description = "Autonomous Operational Intelligence Platform"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.1",
    "pydantic>=2.7.4",
    "pydantic-settings>=2.3.4",
    "celery>=5.4.0",
    "redis>=5.0.7",
    "SQLAlchemy>=2.0.31",
    "alembic>=1.13.2",
    "psycopg2-binary>=2.9.9",
    "asyncpg>=0.29.0",
    "scikit-learn>=1.5.1",
    "xgboost>=2.1.0",
    "numpy<2.0.0",
    "pandas>=2.2.2",
    "langgraph>=0.1.9",
    "langchain>=0.2.7",
    "langchain-core>=0.2.43",
    "langchain-groq>=0.1.6",
    "groq>=0.9.0",
    "httpx>=0.27.0",
    "authlib>=1.3.1",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "slowapi>=0.1.9",
    "structlog>=24.2.0",
    "prometheus-client>=0.20.0",
    "docker>=7.1.0",
]
# NOTE: this list must stay identical in substance to requirements.txt.
# requirements.txt is the pinned, authoritative dependency set (Blueprint
# v2 Section 2.2) — this array exists only so `pip install -e .` works for
# editable installs. Do not add prophet, spacy, sentence-transformers,
# mlflow, or pgvector (the Python client) here: all four were explicitly
# cut in Blueprint v2 Section 0 and are not imported anywhere in app/.

[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 3

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --cov=app --cov-report=term-missing"
testpaths = [
    "app",
]
python_files = ["test_*.py", "*_test.py"]
