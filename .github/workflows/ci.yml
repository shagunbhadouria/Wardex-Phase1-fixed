name: SentinelAI CI/CD Pipeline

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  stage-1-test-and-quality-gate:
    name: "Stage 1: Quality Gate & Tests"
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sentinelai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sentinelai_test
      REDIS_URL: redis://localhost:6379/0
      GROQ_API_KEY: mock_key_for_testing
      ENVIRONMENT: test

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run Flake8 Linter
        run: flake8 app --max-line-length=88 --extend-ignore=E203,W503

      - name: Run Isort Import Check
        run: isort --check-only app

      - name: Run Mypy Type Checking
        run: mypy app

      - name: Run Tests with Coverage
        run: pytest app/ --cov=app --cov-report=term-missing

      - name: Secret Scan (detect-secrets)
        run: |
          if [ ! -f .secrets.baseline ]; then
            echo "::error::.secrets.baseline is missing. Generate one with"
            echo "::error::'detect-secrets scan > .secrets.baseline' and commit it —"
            echo "::error::this check must not silently no-op."
            exit 1
          fi
          # 'detect-secrets audit' is interactive-only (calls input() to ask
          # a human to label each finding) and crashes with an unhandled
          # EOFError the moment there's a real finding on a non-interactive
          # runner like this one — verified locally, not assumed.
          # 'detect-secrets scan --baseline' is also wrong here: it always
          # exits 0 and only rewrites the baseline file in place, so it
          # can't gate a build either — also verified locally, not assumed.
          # 'detect-secrets-hook --baseline' is the actual CI-safe command:
          # non-interactive, exits 1 on any secret not already accounted
          # for in the baseline. It's also what .pre-commit-config.yaml
          # already runs locally, so CI now checks the same thing the same
          # way instead of silently checking nothing.
          # Note: the hook refuses to run against an *unstaged* baseline
          # (protects against someone editing .secrets.baseline locally
          # without committing it) — not an issue here, since
          # actions/checkout always gives a working tree matching HEAD.
          find app -name '*.py' -print0 | xargs -0 detect-secrets-hook --baseline .secrets.baseline

  stage-2-build-and-push:
    name: "Stage 2: Build & Tag Container"
    needs: stage-1-test-and-quality-gate
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: actions/setup-buildx-action@v3

      - name: Build Docker Image
        run: |
          docker build --target production -t sentinelai-api:${{ github.sha }} .

  stage-3-deploy:
    name: "Stage 3: Automated Deploy"
    needs: stage-2-build-and-push
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render Deploy Hook
        run: |
          echo "Triggering automated deploy to Render..."
